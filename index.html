.grade-Aplus { background: #EAF3DE; color: #27500A; }

.dot-lab { background: #1D9E75; }

  const lVals = RAW_LAB.map(r => parseFloat(r.gt)||0);
  const uniqueStudents = allIds.length;
  const tAvg = tVals.length ? Math.round(tVals.reduce((a,b)=>a+b,0)/tVals.length) : 0;
  const lAvg = lVals.length ? Math.round(lVals.reduce((a,b)=>a+b,0)/lVals.length) : 0;
  const passCount = [...new Set(RAW_THEORY.map(r=>r.short_id))].filter(id => {
    const recs = theoryMap[id]||[];
    return recs.some(r => !['F','I',''].includes(r.gt));
  }).length;
  const passRate = Math.round(passCount / uniqueStudents * 100);
  document.getElementById('sTotalStudents').textContent = uniqueStudents;
  document.getElementById('sTheoryAvg').textContent = tAvg;
  document.getElementById('sLabAvg').textContent = lAvg;
  document.getElementById('sPassRate').textContent = passRate + '%';
}

function renderCard(sid) {
  const tRecs = theoryMap[sid] || [];
  const lRecs = labMap[sid] || [];
  const firstName = (tRecs[0]||lRecs[0])?.name || sid;
  const fullId = (tRecs[0]||lRecs[0])?.full_id || '';
  const tFinal = tRecs.length ? tRecs.map(r=>parseInt(r.final)||0).reduce((a,b)=>a+b,0) / tRecs.length : null;
  const lGt = lRecs.length ? lRecs.map(r=>parseInt(r.gt)||0).reduce((a,b)=>a+b,0) / lRecs.length : null;
  const tGr = tRecs.length ? tRecs[tRecs.length-1].gt : null;
  const lGr = lRecs.length ? lRecs[lRecs.length-1].gr : null;
  const tGp = tRecs.length ? tRecs[tRecs.length-1].gr : null;
  const lGp = lRecs.length ? lRecs[lRecs.length-1].gp : null;

  let theoryHTML = tRecs.length ? tRecs.map(r => `
    <div class="score-row"><span class="lbl">Attendance (ATM)</span><span class="val">${parseFloat(r.atm).toFixed(2)}</span></div>
    <div class="score-row"><span class="lbl">Quiz Avg</span><span class="val">${parseFloat(r.avg_quiz).toFixed(2)} / 15</span></div>
    <div class="score-row"><span class="lbl">Presentation</span><span class="val">${r.presn} / 8</span></div>
    <div class="score-row"><span class="lbl">Assignment</span><span class="val">${r.assign} / 5</span></div>
    <div class="score-row"><span class="lbl">Mid-Term</span><span class="val">${r.mid} / 20</span></div>
    <div class="score-row"><span class="lbl">Term (internal)</span><span class="val">${parseFloat(r.term).toFixed(2)}</span></div>
    <div class="score-row"><span class="lbl">Final Mark</span><span class="val"><strong>${r.final} / 100</strong></span></div>
    ${tRecs.length>1?'<div style="height:1px;background:var(--color-border-tertiary);margin:6px 0;"></div>':''}
  `).join('') : '<div class="no-data">No theory record found</div>';

  let labHTML = lRecs.length ? lRecs.map(r => `
    <div class="score-row"><span class="lbl">ATM</span><span class="val">${parseFloat(r.atm).toFixed(2)}</span></div>
    <div class="score-row"><span class="lbl">UTM</span><span class="val">${r.utm} / 10</span></div>
    <div class="score-row"><span class="lbl">Lab Final</span><span class="val">${r.lab_final} / 40</span></div>
    <div class="score-row"><span class="lbl">Lab Report / Project</span><span class="val">${r.lab_report} / 25</span></div>
    <div class="score-row"><span class="lbl">Lab Performance</span><span class="val">${r.lab_perform} / 25</span></div>
    <div class="score-row"><span class="lbl">Grand Total</span><span class="val"><strong>${r.gt} / 100</strong></span></div>
    ${lRecs.length>1?'<div style="height:1px;background:var(--color-border-tertiary);margin:6px 0;"></div>':''}
  `).join('') : '<div class="no-data">No lab record found</div>';

  const tPct = tFinal !== null ? pct(tFinal, 100) : 0;
  const lPct = lGt !== null ? pct(lGt, 100) : 0;

  return `
  <div class="result-card">
    <div class="result-header">
      <div class="student-info">
        <h2>${firstName}</h2>
        <div class="sid">${sid} &nbsp;·&nbsp; ${fullId}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        ${tGr ? `<span class="grade-pill ${gradeClass(tGr)}">T: ${tGr} <span class="gp-text">(${tRecs[tRecs.length-1].gr} GP)</span></span>` : ''}
        ${lGr ? `<span class="grade-pill ${gradeClass(lGr)}">L: ${lGr} <span class="gp-text">(${lGp} GP)</span></span>` : ''}
      </div>
    </div>
    <div class="bar-wrap" style="margin-bottom:14px;">
      ${tFinal!==null?`<div class="bar-label"><span>Theory &nbsp;<strong>${Math.round(tFinal)}/100</strong></span><span>${tPct}%</span></div><div class="bar-track"><div class="bar-fill bar-theory" style="width:${tPct}%"></div></div>`:''}
      ${lGt!==null?`<div class="bar-label" style="margin-top:8px;"><span>Lab &nbsp;<strong>${Math.round(lGt)}/100</strong></span><span>${lPct}%</span></div><div class="bar-track"><div class="bar-fill bar-lab" style="width:${lPct}%"></div></div>`:''}
    </div>
    <div class="sections-grid">
      <div class="section">
        <div class="section-title"><span class="section-dot dot-theory"></span> Theory</div>
        ${theoryHTML}
      </div>
      <div class="section">
        <div class="section-title"><span class="section-dot dot-lab"></span> Lab</div>
        ${labHTML}
      </div>
    </div>
    ${tRecs.length>1?`<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:8px;">${tRecs.length} theory records found (merged)</div>`:''}
  </div>`;
}

function search(q) {
  q = q.trim();
  const area = document.getElementById('resultsArea');
  if (!q) {
    area.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128269;</div><div>Enter a Registration ID above to view student details</div><div style="margin-top:6px;font-size:12px;color:var(--color-text-tertiary)">Supports partial match — try "251-15-0"</div></div>`;
    return;
  }
  const matched = allIds.filter(id => id.includes(q));
  if (!matched.length) {
    area.innerHTML = `<div class="empty-state"><div class="empty-icon">&#9785;</div><div>No student found for "<strong>${q}</strong>"</div><div style="margin-top:6px;font-size:12px;color:var(--color-text-tertiary)">Try a partial ID like "251-15-0"</div></div>`;
    return;
  }
  if (matched.length === 1) {
    area.innerHTML = renderCard(matched[0]);
    return;
  }
  if (matched.length <= 8) {
    area.innerHTML = matched.map(sid => renderCard(sid)).join('');
    return;
  }
  let listHTML = `<div class="section-heading">${matched.length} students matched — click to expand</div>`;
  listHTML += matched.map(sid => {
    const rec = (theoryMap[sid]||[])[0] || (labMap[sid]||[])[0];
    const tGr = (theoryMap[sid]||[]).slice(-1)[0]?.gt;
    const lGr = (labMap[sid]||[]).slice(-1)[0]?.gr;
    return `<div class="multi-item" onclick="showSingle('${sid}')">
      <div>
        <div class="multi-name">${rec?.name||sid}</div>
        <div class="multi-id">${sid}</div>
      </div>
      <div class="multi-badges">
        ${tGr?`<span class="mini-badge ${gradeClass(tGr)}" style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);">T: ${tGr}</span>`:''}
        ${lGr?`<span class="mini-badge ${gradeClass(lGr)}" style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);">L: ${lGr}</span>`:''}
      </div>
    </div>`;
  }).join('');
  area.innerHTML = listHTML;
}

function showSingle(sid) {
  document.getElementById('resultsArea').innerHTML = renderCard(sid);
}

document.getElementById('searchInput').addEventListener('input', e => search(e.target.value));
renderStats();
</script>
